name: standalone-native
on: [push, pull_request]
jobs:
  clean-native-stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Create isolated base-only environment
        run: python -m venv /tmp/fluxemu-native-stage1
      - name: Install wheel with native dependencies only
        run: /tmp/fluxemu-native-stage1/bin/python -m pip install ./codex pytest
      - name: Prove optional solver and plotting stacks are unavailable
        run: >-
          /tmp/fluxemu-native-stage1/bin/python -c
          "import importlib.util;
          names=('cobra','optlang','mfapy','scipy','matplotlib');
          assert all(importlib.util.find_spec(name) is None for name in names),
          {name: importlib.util.find_spec(name) for name in names}"
      - name: Import native public API without optional stacks
        run: >-
          /tmp/fluxemu-native-stage1/bin/python -c
          "import fluxemu;
          assert callable(fluxemu.run_native_stationary_ensemble)"
      - name: Run installed deterministic CLI
        run: >-
          /tmp/fluxemu-native-stage1/bin/fluxemu run
          --model codex/tests/fixtures/native_portability/model.xml
          --experiment codex/tests/fixtures/native_portability/experiment.yaml
          --output /tmp/fluxemu-output
      - name: Run complete base-only native Stage 1 gates
        run: >-
          /tmp/fluxemu-native-stage1/bin/pytest -q
          codex/tests/test_cli.py
          codex/tests/test_native_highs_flux_analysis.py
          codex/tests/test_native_highs_vffva.py
          codex/tests/test_native_highs_sampling.py
          codex/tests/test_native_highs_import_isolation.py
          codex/tests/test_native_stationary_analysis.py
          codex/tests/test_native_stage1_ensemble_integration.py
          codex/tests/test_native_stationary_batch_diagnostics.py
          codex/tests/test_real_model_acceptance.py
