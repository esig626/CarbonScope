name: standalone-native
on: [push, pull_request]
jobs:
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install ./codex
      - run: python -c "import fluxemu; assert 'cobra' not in __import__('sys').modules; assert 'mfapy' not in __import__('sys').modules"
      - run: fluxemu run --model codex/tests/fixtures/native_portability/model.xml --experiment codex/tests/fixtures/native_portability/experiment.yaml --output /tmp/fluxemu-output
