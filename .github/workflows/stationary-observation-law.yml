name: Stationary multinomial observation law

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  observation-base:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: codex/pyproject.toml
      - name: Install the base wheel in an isolated environment
        run: |
          python -m venv /tmp/fluxemu-observation-base
          /tmp/fluxemu-observation-base/bin/python -m pip install ./codex pytest
          /tmp/fluxemu-observation-base/bin/python -m pip check
      - name: Prove optional scientific stacks are absent
        run: >-
          /tmp/fluxemu-observation-base/bin/python -c
          "import importlib.util;
          names=('scipy','cobra','optlang','mfapy','matplotlib');
          assert all(importlib.util.find_spec(name) is None for name in names),
          {name: importlib.util.find_spec(name) for name in names}"
      - name: Compile the observation package and tests
        run: >-
          /tmp/fluxemu-observation-base/bin/python -m compileall -q
          codex/src/fluxemu/observation codex/tests
      - name: Run count-law, exhaustive oracle, native bridge, and import-isolation gates
        run: >-
          /tmp/fluxemu-observation-base/bin/python -m pytest -q
          codex/tests/test_observation_*.py
