name: Native HiGHS flux analysis
on: [push, pull_request]
jobs:
  native-highs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install './codex[highs]' pytest
      - run: python -c "import highspy; print(highspy.HIGHS_VERSION_MAJOR, highspy.HIGHS_VERSION_MINOR, highspy.HIGHS_VERSION_PATCH)"
      - run: git diff --check
      - run: python -m compileall -q codex/src codex/tests
      - run: pytest -q codex/tests/test_native_highs_flux_analysis.py
      - run: pytest -q codex/tests/test_native_highs_cobra_parity.py
      - run: pytest -q codex/tests/test_cobra_analysis.py codex/tests/test_standalone_model_projection.py
      - run: pytest -q codex/tests/test_native_highs_import_isolation.py
