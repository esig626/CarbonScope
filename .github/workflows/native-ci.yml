name: Native FluxEMU CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  base-native:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install base package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pip check
      - name: Compile retained Python sources
        run: python -m compileall -q src tests examples benchmarks tools
      - name: Check complete branch diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Check native-only boundaries
        run: |
          ! grep -RInE '(^|[^A-Za-z])(from|import)[[:space:]]+(cobra|mfapy|optlang|nlopt)([.]|[[:space:]]|$)' src tests examples docs
          ! grep -RInE 'BrunoOrderCertificate|lower certificate|order certificate|global_envelope_certified' src tests docs README.md
          test ! -d vendor
          test ! -d codex
      - name: Verify base import isolation
        run: |
          python - <<'PY'
          import sys
          import fluxemu
          blocked = {"cobra", "mfapy", "optlang", "nlopt"}
          imported = {name.split('.', 1)[0] for name in sys.modules}
          assert not (blocked & imported), blocked & imported
          PY
      - name: Run base/install-isolation and CLI gates
        run: >-
          pytest -q
          tests/test_native_highs_import_isolation.py
          tests/test_mfa_import_isolation.py
          tests/test_observation_import_isolation.py
          tests/test_testing_import_isolation.py
          tests/test_native_portability.py
          tests/test_cli.py
      - name: Verify clean checkout
        run: test -z "$(git status --porcelain)"

  full-native:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install full native package
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[mfa,transient]' pytest
          python -m pip check
      - name: Compile retained Python sources
        run: python -m compileall -q src tests examples benchmarks tools
      - name: Run full retained native suite
        run: pytest -q
      - name: Run public examples
        run: |
          python examples/stationary_mfa_recovery.py
          python examples/simple_binary_flux_discrimination.py
      - name: Verify clean checkout
        run: test -z "$(git status --porcelain)"
