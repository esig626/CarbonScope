name: Real-model 50:50 U-13C acceptance gate

on:
  push:
  pull_request:

jobs:
  acceptance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: codex/pyproject.toml
      - name: Install native FluxEMU and HiGHS
        run: python -m pip install -e './codex[highs]' pytest matplotlib
      - name: Verify frozen handoff, native flux parity, FVA, and extension gate
        run: pytest -q codex/tests/test_real_model_acceptance.py
      - name: Execute final native HiGHS acceptance
        run: python codex/tools/run_real_model_acceptance.py
      - name: Verify generated positive programme plots
        run: |
          test "$(find codex/results/real_model_50_50_u13c_glucose/final_native_highs/positive_emu/biomass/plots -name '*.png' | wc -l)" -eq 12
          test "$(find codex/results/real_model_50_50_u13c_glucose/final_native_highs/positive_emu/acetate/plots -name '*.png' | wc -l)" -eq 12
          test "$(find codex/results/real_model_50_50_u13c_glucose/final_native_highs/positive_emu -name '*.png' | wc -l)" -eq 24
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-model-50-50-u13c-acceptance
          path: |
            codex/results/real_model_50_50_u13c_glucose/final_native_highs/
            codex/results/real_model_50_50_u13c_glucose/frozen_flux_reference/
