name: Canonical stationary forward parity

on:
  pull_request:
  workflow_dispatch:

jobs:
  canonical-stationary-forward:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: codex/pyproject.toml

      - name: Install FluxEMU and mfapy backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e './codex[mfapy]' pytest matplotlib

      - name: Check patch whitespace
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD

      - name: Compile Python sources and tests
        run: python -m compileall -q codex/src codex/tests

      - name: Run canonical model and stationary forward gates
        run: >-
          pytest -q
          codex/tests/test_standalone_model_contract.py
          codex/tests/test_standalone_model_projection.py
          codex/tests/test_canonical_forward.py
          codex/tests/test_canonical_forward_parity.py
