name: Native stationary EMU

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-stationary-emu-base:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: codex/pyproject.toml

      - name: Install only native runtime and test driver
        run: python -m pip install --upgrade pip && python -m pip install -e ./codex pytest

      - name: Check patch whitespace
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD

      - name: Compile production sources and tests
        run: python -m compileall -q codex/src codex/tests

      - name: Run canonical and native stationary gates
        run: >-
          pytest -q
          codex/tests/test_standalone_model_contract.py
          codex/tests/test_native_emu_graph.py
          codex/tests/test_native_emu_tracers.py
          codex/tests/test_native_stationary_emu.py
          codex/tests/test_native_stationary_analysis.py
          codex/tests/test_native_stage1_ensemble_integration.py
          codex/tests/test_native_stationary_batch_diagnostics.py

  optional-compatibility-oracles:
    runs-on: ubuntu-latest
    env:
      FLUXEMU_MFAPY_SOURCE: ${{ github.workspace }}/vendor/mfapy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: codex/pyproject.toml
      - name: Install optional COBRA, mfapy-backend, and oracle dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e './codex[compat,mfapy]' pytest matplotlib
      - name: Run optional compatibility and independent-oracle gates
        run: >-
          pytest -q -s
          codex/tests/test_standalone_model_projection.py
          codex/tests/test_canonical_forward.py
          codex/tests/test_canonical_forward_parity.py
          codex/tests/test_native_stationary_parity.py
          codex/tests/test_antoniewicz_tca.py
          codex/tests/test_antoniewicz_tca_glucose.py
