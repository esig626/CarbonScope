name: Simple binary Renyi certificates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testing-base:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: codex/pyproject.toml
      - name: Install the base wheel in an isolated environment
        run: |
          python -m venv /tmp/fluxemu-testing-base
          /tmp/fluxemu-testing-base/bin/python -m pip install ./codex pytest
          /tmp/fluxemu-testing-base/bin/python -m pip check
      - name: Prove optional scientific stacks are absent
        run: >-
          /tmp/fluxemu-testing-base/bin/python -c
          "import importlib.util;
          names=('scipy','cobra','optlang','mfapy','matplotlib','jax');
          assert all(importlib.util.find_spec(name) is None for name in names),
          {name: importlib.util.find_spec(name) for name in names}"
      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          else
            git diff --check "origin/main...HEAD"
          fi
      - name: Compile sources, tests, and example
        run: >-
          /tmp/fluxemu-testing-base/bin/python -m compileall -q
          codex/src codex/tests codex/examples/simple_binary_flux_discrimination.py
      - name: Run published formulas, independent deterministic oracles, native bridge, and isolation
        run: >-
          /tmp/fluxemu-testing-base/bin/python -m pytest -q
          codex/tests/test_testing_*.py codex/tests/test_observation_*.py
      - name: Execute genuine-count flux discrimination example
        run: /tmp/fluxemu-testing-base/bin/python codex/examples/simple_binary_flux_discrimination.py
