name: Native transient EMU shadow parity
on: [pull_request, push]
jobs:
  native-transient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: codex/pyproject.toml
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e './codex[transient,mfapy]' pytest
      - name: Check patch whitespace
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
      - name: Compile production package
        run: python -m compileall -q codex/src
      - name: Canonical and stationary regressions
        run: python -m pytest -q codex/tests/test_standalone_model_contract.py codex/tests/test_standalone_model_projection.py codex/tests/test_canonical_forward.py codex/tests/test_canonical_forward_parity.py codex/tests/test_native_emu_graph.py codex/tests/test_native_emu_tracers.py codex/tests/test_native_stationary_emu.py codex/tests/test_native_stationary_parity.py
      - name: Transient contract and exact controls
        run: python -m pytest -q codex/tests/test_transient_experiment_contract.py codex/tests/test_native_transient_emu.py
      - name: Historical transient and stationary-limit gates
        run: python -m pytest -q codex/tests/test_native_transient_parity.py codex/tests/test_antoniewicz_tca.py codex/tests/test_antoniewicz_tca_glucose.py
