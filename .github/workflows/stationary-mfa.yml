name: Stationary KL and Renyi MFA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  base-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: codex/pyproject.toml
      - name: Install base wheel in an isolated environment
        run: |
          python -m venv /tmp/fluxemu-mfa-base
          /tmp/fluxemu-mfa-base/bin/python -m pip install ./codex pytest
          /tmp/fluxemu-mfa-base/bin/python -m pip check
      - name: Prove optional stacks are absent
        run: >-
          /tmp/fluxemu-mfa-base/bin/python -c
          "import importlib.util;
          names=('scipy','cobra','optlang','mfapy','matplotlib');
          assert all(importlib.util.find_spec(name) is None for name in names),
          {name: importlib.util.find_spec(name) for name in names}"
      - name: Check patch whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          else
            git diff --check "origin/main...HEAD"
          fi
      - name: Compile sources and tests
        run: /tmp/fluxemu-mfa-base/bin/python -m compileall -q codex/src codex/tests codex/examples/stationary_mfa_recovery.py
      - name: Run base-only MFA schemas, preprocessing, divergence, and native-objective firewall
        run: >-
          /tmp/fluxemu-mfa-base/bin/python -m pytest -q
          codex/tests/test_mfa_schema.py
          codex/tests/test_mfa_normalisation.py
          codex/tests/test_mfa_divergence.py
          codex/tests/test_mfa_import_isolation.py
      - name: Run complete relevant native Stage 1 regression gates
        run: >-
          /tmp/fluxemu-mfa-base/bin/python -m pytest -q
          codex/tests/test_cli.py
          codex/tests/test_native_portability.py
          codex/tests/test_standalone_model_contract.py
          codex/tests/test_native_highs_flux_analysis.py
          codex/tests/test_native_highs_vffva.py
          codex/tests/test_native_highs_sampling.py
          codex/tests/test_native_highs_import_isolation.py
          codex/tests/test_native_emu_graph.py
          codex/tests/test_native_emu_tracers.py
          codex/tests/test_native_stationary_emu.py
          codex/tests/test_native_stationary_analysis.py
          codex/tests/test_native_stage1_ensemble_integration.py
          codex/tests/test_native_stationary_batch_diagnostics.py
          codex/tests/test_real_model_acceptance.py

  mfa-extra:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: codex/pyproject.toml
      - name: Install MFA wheel in an isolated environment
        run: |
          python -m venv /tmp/fluxemu-mfa-extra
          /tmp/fluxemu-mfa-extra/bin/python -m pip install './codex[mfa]' pytest
          /tmp/fluxemu-mfa-extra/bin/python -m pip check
      - name: Prove native MFA has only its declared optional optimizer
        run: >-
          /tmp/fluxemu-mfa-extra/bin/python -c
          "import importlib.util; import scipy; import highspy;
          names=('cobra','optlang','mfapy','matplotlib');
          assert all(importlib.util.find_spec(name) is None for name in names);
          print('SciPy',scipy.__version__,'HiGHS',highspy.HIGHS_VERSION_MAJOR,highspy.HIGHS_VERSION_MINOR,highspy.HIGHS_VERSION_PATCH)"
      - name: Run all stationary MFA acceptance tests
        run: /tmp/fluxemu-mfa-extra/bin/python -m pytest -q codex/tests/test_mfa_*.py
      - name: Run shared geometry and Stage 1 regressions with the MFA extra
        run: >-
          /tmp/fluxemu-mfa-extra/bin/python -m pytest -q
          codex/tests/test_native_highs_flux_analysis.py
          codex/tests/test_native_highs_vffva.py
          codex/tests/test_native_highs_sampling.py
          codex/tests/test_native_highs_import_isolation.py
          codex/tests/test_native_stationary_emu.py
          codex/tests/test_native_stationary_analysis.py
          codex/tests/test_native_stage1_ensemble_integration.py
          codex/tests/test_native_stationary_batch_diagnostics.py
          codex/tests/test_real_model_acceptance.py
      - name: Execute identifiable recovery and non-identifiability example
        run: /tmp/fluxemu-mfa-extra/bin/python codex/examples/stationary_mfa_recovery.py
