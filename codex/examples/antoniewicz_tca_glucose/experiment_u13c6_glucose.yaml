  - {fragment_id: DHAP, metabolite_id: DHAP, atom_positions: [1, 2, 3], analytical_method: intermediate, formula: C3H7O6P, correction: no}
  - {fragment_id: GAP, metabolite_id: GAP, atom_positions: [1, 2, 3], analytical_method: intermediate, formula: C3H7O6P, correction: no}
