[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxemu"
version = "0.1.0"
description = "Standalone FluxEMU isotope-resolved metabolic modelling package"
requires-python = ">=3.11"
dependencies = [
  "cobra==0.31.1",
  "numpy>=2.0",
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
highs = [
  "highspy>=1.11,<1.13",
]
transient = [
  "scipy>=1.13",
]
# mfapy imports SciPy at backend module load time.  SciPy 1.13 is the first
# release line compatible with this project's NumPy 2.x lower bound.
mfapy = [
  "scipy>=1.13",
]

[project.scripts]
fluxemu = "fluxemu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fluxemu.carbon_transitions" = ["data/*.yaml", "docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
