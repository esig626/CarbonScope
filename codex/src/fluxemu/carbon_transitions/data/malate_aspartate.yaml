      - {from: alanine.C2, to: pyruvate.C2}
      - {from: alanine.C3, to: pyruvate.C3}
      - {from: alpha_ketoglutarate.C1, to: glutamate.C1}
      - {from: alpha_ketoglutarate.C2, to: glutamate.C2}
      - {from: alpha_ketoglutarate.C3, to: glutamate.C3}
      - {from: alpha_ketoglutarate.C4, to: glutamate.C4}
      - {from: alpha_ketoglutarate.C5, to: glutamate.C5}
    reverse_atom_map: derived
    mapping_branches: []
    reversible: true
    symmetry: none
    stereochemistry_notes: "No carbon atom crosses between skeletons; alanine maps to pyruvate and alpha-ketoglutarate maps to glutamate."
    numbering_convention: "mfapy Example_3 MCF7 source-map sequence."
    aliases: [ALATA_L]
    ec_numbers: [EC:2.6.1.2]
    identifiers: {kegg.reaction: [R00258], bigg.reaction: [ALATA_L]}
    provenance: {source_type: "curated composite from explicit isotope-MFA maps", citation: "mfapy 0.6.3 Example_3 MCF7 model", source_identifier: "r58_gpt_m plus r50_gludh", source_location: "vendor/mfapy/sample/Example_3_MCF7_model.txt", notes: "r58 explicitly maps Pyr -> Ala ABC -> ABC and r50 maps aKG -> Glu ABCDE -> ABCDE; their inverse/component maps define the no-exchange transaminase skeleton transfer."}
