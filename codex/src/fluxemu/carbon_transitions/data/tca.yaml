      - {from: alpha_ketoglutarate.C3, to: succinate.C2}
      - {from: alpha_ketoglutarate.C4, to: succinate.C3}
      - {from: alpha_ketoglutarate.C5, to: succinate.C4}
    reverse_atom_map: not_applicable
    mapping_branches: []
    reversible: false
    symmetry: succinate is rotationally symmetric downstream
    stereochemistry_notes: "Exact Table 5 net map bcde + a."
    numbering_convention: "Antoniewicz Table 5 source-map order, paper p. 37."
    aliases: [v4, AKGDH]
    ec_numbers: [EC:1.2.4.2]
    identifiers: {kegg.reaction: [R01197], bigg.reaction: [AKGDH]}
    provenance: {source_type: "published EMU model", citation: "Antoniewicz, Kelleher & Stephanopoulos, Metabolic Engineering (2007)", source_identifier: "Table 5 v4", source_location: "nihms16238.pdf, paper p. 37 Table 5; frozen examples/antoniewicz_tca/build_model.py: TABLE5_REACTIONS", notes: "Gold entry generated from frozen validated Table5Reaction definition."}
    validation_status: gold
    comments: "CO2 fate is explicit."
  - canonical_id: antoniewicz.table5.v5.succinate_to_fumarate
    name: succinate to fumarate (Antoniewicz Table 5 v5)
    pathway: TCA cycle
    substrates: [succinate]
    products: [fumarate]
    carbon_counts: {succinate: 4, fumarate: 4}
    forward_atom_map:
      - {from: succinate.C1, to: fumarate.C1}
      - {from: succinate.C2, to: fumarate.C2}
      - {from: succinate.C3, to: fumarate.C3}
      - {from: succinate.C4, to: fumarate.C4}
    reverse_atom_map: not_applicable
    mapping_branches:
      - id: canonical_orientation
        weight: 0.5
        atom_map:
          - {from: succinate.C1, to: fumarate.C1}
          - {from: succinate.C2, to: fumarate.C2}
          - {from: succinate.C3, to: fumarate.C3}
          - {from: succinate.C4, to: fumarate.C4}
      - id: reversed_orientation
        weight: 0.5
        atom_map:
          - {from: succinate.C1, to: fumarate.C4}
          - {from: succinate.C2, to: fumarate.C3}
          - {from: succinate.C3, to: fumarate.C2}
          - {from: succinate.C4, to: fumarate.C1}
    reversible: false
    symmetry: "Antoniewicz Table 5 equal 0.5 forward/reverse orientations; both endpoint skeletons symmetric"
    stereochemistry_notes: "Do not collapse to one orientation."
    numbering_convention: "Antoniewicz Table 5 source-map order, paper p. 37."
    aliases: [v5, SUCDi]
    ec_numbers: [EC:1.3.5.1]
    identifiers: {kegg.reaction: [R02164], bigg.reaction: [SUCDi]}
    provenance: {source_type: "published EMU model", citation: "Antoniewicz, Kelleher & Stephanopoulos, Metabolic Engineering (2007)", source_identifier: "Table 5 v5", source_location: "nihms16238.pdf, paper p. 37 Table 5; frozen examples/antoniewicz_tca/build_model.py: TABLE5_REACTIONS", notes: "Gold 0.5 / 0.5 branch treatment derived directly from printed Table 5 transition."}
    validation_status: gold
    comments: "mfapy export uses its symmetric-metabolite treatment while retaining explicit branches for audit."
