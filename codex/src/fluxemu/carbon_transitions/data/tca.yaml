    reversible: false
    symmetry: "Antoniewicz Table 5 0.5 / 0.5 symmetric fumarate input orientations"
    stereochemistry_notes: "Benchmark net transition; hydration/oxidation are not split."
    numbering_convention: "Antoniewicz Table 5 source-map order, paper p. 37."
