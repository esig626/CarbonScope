schema_version: 1
# The eight antoniewicz.table5.* entries are generated/transcribed from the
# frozen Table5Reaction definitions.  tests/test_carbon_transitions.py compares
# their normalized maps against those definitions, preventing a second editable
# interpretation of the published benchmark.
entries:
  - canonical_id: antoniewicz.table5.v1.citrate_synthase
    name: oxaloacetate + acetyl-CoA to citrate (Antoniewicz Table 5 v1)
    pathway: TCA cycle
    substrates: [oxaloacetate, acetyl_coa]
    products: [citrate]
    carbon_counts: {oxaloacetate: 4, acetyl_coa: 2, citrate: 6}
    forward_atom_map:
      - {from: oxaloacetate.C1, to: citrate.C6}
      - {from: oxaloacetate.C2, to: citrate.C3}
      - {from: oxaloacetate.C3, to: citrate.C2}
      - {from: oxaloacetate.C4, to: citrate.C1}
      - {from: acetyl_coa.C1, to: citrate.C5}
      - {from: acetyl_coa.C2, to: citrate.C4}
    reverse_atom_map: not_applicable
    mapping_branches: []
    reversible: false
    symmetry: none
    stereochemistry_notes: "Exact Table 5 order dcbfea, represented as global C positions."
    numbering_convention: "Antoniewicz Table 5 source-map order, paper p. 37."
    aliases: [v1, CS]
    ec_numbers: [EC:2.3.3.1]
    identifiers: {kegg.reaction: [R00351], bigg.reaction: [CS]}
    provenance: {source_type: "published EMU model", citation: "Antoniewicz, Kelleher & Stephanopoulos, Metabolic Engineering (2007)", source_identifier: "Table 5 v1", source_location: "nihms16238.pdf, paper p. 37 Table 5; frozen examples/antoniewicz_tca/build_model.py: TABLE5_REACTIONS", notes: "Gold entry generated from frozen validated Table5Reaction definition; no independent remapping."}
    validation_status: gold
    comments: "Reverse biochemical map is not declared for the benchmark's irreversible v1."
  - canonical_id: antoniewicz.table5.v2.citrate_to_akg
    name: citrate to alpha-ketoglutarate + CO2 (Antoniewicz Table 5 v2)
    pathway: TCA cycle
    substrates: [citrate]
    products: [alpha_ketoglutarate, carbon_dioxide]
    carbon_counts: {citrate: 6, alpha_ketoglutarate: 5, carbon_dioxide: 1}
    forward_atom_map:
      - {from: citrate.C1, to: alpha_ketoglutarate.C1}
      - {from: citrate.C2, to: alpha_ketoglutarate.C2}
      - {from: citrate.C3, to: alpha_ketoglutarate.C3}
      - {from: citrate.C4, to: alpha_ketoglutarate.C4}
      - {from: citrate.C5, to: alpha_ketoglutarate.C5}
      - {from: citrate.C6, to: carbon_dioxide.C1}
    reverse_atom_map: not_applicable
    mapping_branches: []
    reversible: false
    symmetry: none
    stereochemistry_notes: "Exact Table 5 net carbon transition; intermediate isomerization is not expanded."
    numbering_convention: "Antoniewicz Table 5 source-map order, paper p. 37."
    aliases: [v2, ICDHyr]
    ec_numbers: [EC:1.1.1.42]
    identifiers: {kegg.reaction: [R00709], bigg.reaction: [ICDHyr]}
    provenance: {source_type: "published EMU model", citation: "Antoniewicz, Kelleher & Stephanopoulos, Metabolic Engineering (2007)", source_identifier: "Table 5 v2", source_location: "nihms16238.pdf, paper p. 37 Table 5; frozen examples/antoniewicz_tca/build_model.py: TABLE5_REACTIONS", notes: "Gold entry generated from frozen validated Table5Reaction definition."}
    validation_status: gold
    comments: "CO2 fate is explicit."
