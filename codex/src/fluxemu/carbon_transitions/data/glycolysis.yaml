schema_version: 1
entries:
  - canonical_id: transport.glucose.identity
    name: glucose transport (carbon identity)
    pathway: glycolysis
    substrates: [glucose]
    products: [glucose]
    carbon_counts: {glucose: 6}
    forward_atom_map: &glucose_identity
      - {from: glucose.C1, to: glucose.C1}
      - {from: glucose.C2, to: glucose.C2}
      - {from: glucose.C3, to: glucose.C3}
      - {from: glucose.C4, to: glucose.C4}
      - {from: glucose.C5, to: glucose.C5}
      - {from: glucose.C6, to: glucose.C6}
    reverse_atom_map: derived
    mapping_branches: []
    reversible: true
    symmetry: none
    stereochemistry_notes: "Compartment transport preserves every glucose carbon."
    numbering_convention: "FluxEMU source-map C1..C6 sequence."
    aliases: [GLC_IN]
    ec_numbers: []
    identifiers: {}
    provenance: {source_type: "validated synthetic FluxEMU benchmark", citation: "FluxEMU antoniewicz_tca_glucose frozen synthetic glycolysis", source_identifier: "GLC_IN", source_location: "examples/antoniewicz_tca_glucose/build_model.py: GLYCOLYSIS_REACTIONS", notes: "Synthetic benchmark mapping; not attributed to Antoniewicz et al."}
    validation_status: curated
    comments: "Use for a model-specific glucose compartment transfer only when carbon chemistry is exactly glucose -> glucose."
  - canonical_id: glycolysis.hexokinase
    name: hexokinase carbon skeleton transition
    pathway: glycolysis
    substrates: [glucose]
    products: [glucose_6_phosphate]
    carbon_counts: {glucose: 6, glucose_6_phosphate: 6}
    forward_atom_map:
      - {from: glucose.C1, to: glucose_6_phosphate.C1}
      - {from: glucose.C2, to: glucose_6_phosphate.C2}
      - {from: glucose.C3, to: glucose_6_phosphate.C3}
      - {from: glucose.C4, to: glucose_6_phosphate.C4}
      - {from: glucose.C5, to: glucose_6_phosphate.C5}
      - {from: glucose.C6, to: glucose_6_phosphate.C6}
    reverse_atom_map: not_applicable
    mapping_branches: []
    reversible: false
    symmetry: none
    stereochemistry_notes: "Carbon skeleton is retained."
    numbering_convention: "Frozen synthetic glycolysis C1..C6 sequence."
    aliases: [HEX]
    ec_numbers: [EC:2.7.1.1]
    identifiers: {kegg.reaction: [R02848], bigg.reaction: [HEX1]}
    provenance: {source_type: "validated synthetic FluxEMU benchmark", citation: "FluxEMU antoniewicz_tca_glucose frozen synthetic glycolysis", source_identifier: "HEX", source_location: "examples/antoniewicz_tca_glucose/build_model.py: GLYCOLYSIS_REACTIONS", notes: "Synthetic conventional map; status is deliberately curated, not gold."}
