[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxemu"
version = "0.2.0"
description = "Native isotope-resolved metabolic flux modelling and finite-sample inference"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "highspy>=1.11,<1.13",
  "python-libsbml>=5.20,<6",
]

[project.optional-dependencies]
mfa = ["scipy>=1.13"]
transient = ["scipy>=1.13"]
testing = ["scipy>=1.13"]

[project.scripts]
fluxemu = "fluxemu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fluxemu.carbon_transitions" = ["data/*.yaml", "docs/*.md"]
"fluxemu.real_model" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
