  - canonical_id: anaplerosis.pep_carboxykinase
    name: phosphoenolpyruvate carboxykinase carbon transition
    pathway: anaplerosis and cataplerosis
    substrates: [oxaloacetate]
    products: [phosphoenolpyruvate, carbon_dioxide]
    carbon_counts: {oxaloacetate: 4, phosphoenolpyruvate: 3, carbon_dioxide: 1}
    forward_atom_map:
