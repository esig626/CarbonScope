      - {from: oxaloacetate.C2, to: phosphoenolpyruvate.C2}
      - {from: oxaloacetate.C3, to: phosphoenolpyruvate.C3}
      - {from: oxaloacetate.C4, to: carbon_dioxide.C1}
    reverse_atom_map: derived
    mapping_branches: []
    reversible: true
    symmetry: none
    stereochemistry_notes: "OAA C4 is released as CO2 in this source-map convention."
    numbering_convention: "mfapy Example_2 E. coli source-map sequence."
