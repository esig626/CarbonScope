schema_version: 1
entries:
  - canonical_id: anaplerosis.pyruvate_carboxylase
    name: pyruvate carboxylase
    pathway: anaplerosis and cataplerosis
    substrates: [pyruvate, carbon_dioxide]
    products: [oxaloacetate]
    carbon_counts: {pyruvate: 3, carbon_dioxide: 1, oxaloacetate: 4}
    forward_atom_map:
      - {from: pyruvate.C1, to: oxaloacetate.C1}
      - {from: pyruvate.C2, to: oxaloacetate.C2}
      - {from: pyruvate.C3, to: oxaloacetate.C3}
      - {from: carbon_dioxide.C1, to: oxaloacetate.C4}
    reverse_atom_map: not_applicable
    mapping_branches: []
    reversible: false
    symmetry: none
    stereochemistry_notes: "Added CO2 becomes source-map OAA C4."
    numbering_convention: "mfapy Example_3 MCF7 source-map sequence."
    aliases: [PC]
    ec_numbers: [EC:6.4.1.1]
    identifiers: {kegg.reaction: [R00344], bigg.reaction: [PC]}
    provenance: {source_type: "established isotope-MFA model", citation: "mfapy 0.6.3 Example_3 MCF7 model", source_identifier: "r27_pc", source_location: "vendor/mfapy/sample/Example_3_MCF7_model.txt", notes: "Explicit ABC + D -> ABCD map."}
    validation_status: curated
    comments: "ATP/ADP are non-carbon and ignored for matching."
