    name: oxidative pentose-phosphate G6P to 6-phosphogluconate net transition
    pathway: pentose phosphate pathway
    substrates: [glucose_6_phosphate]
    products: [phosphogluconate_6]
    carbon_counts: {glucose_6_phosphate: 6, phosphogluconate_6: 6}
    forward_atom_map:
      - {from: glucose_6_phosphate.C1, to: phosphogluconate_6.C1}
      - {from: glucose_6_phosphate.C2, to: phosphogluconate_6.C2}
      - {from: glucose_6_phosphate.C3, to: phosphogluconate_6.C3}
      - {from: glucose_6_phosphate.C4, to: phosphogluconate_6.C4}
      - {from: glucose_6_phosphate.C5, to: phosphogluconate_6.C5}
      - {from: glucose_6_phosphate.C6, to: phosphogluconate_6.C6}
    reverse_atom_map: not_applicable
    mapping_branches: []
    reversible: false
    symmetry: none
    stereochemistry_notes: "Net source map preserves the six-carbon skeleton."
    numbering_convention: "mfapy Example_3 MCF7 source-map sequence."
    aliases: []
    ec_numbers: []
    identifiers: {}
    provenance: {source_type: "established isotope-MFA model", citation: "mfapy 0.6.3 Example_3 MCF7 model", source_identifier: "r29_g6pdh", source_location: "vendor/mfapy/sample/Example_3_MCF7_model.txt", notes: "The source model abbreviates the mapped product as m6PG and does not expose a separate 6-phosphogluconolactone pool."}
    validation_status: curated
    comments: "This is intentionally a net G6P -> 6PG record. Separate G6PD and lactonase mappings are unresolved in V1."
